<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .kernel { fill: #eff6ff; stroke: #1d4ed8; }
      .user { fill: #ecfdf5; stroke: #047857; }
      .web { fill: #fff7ed; stroke: #c2410c; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="45" text-anchor="middle" class="title">Diagrama de bloques del TP5</text>

  <rect x="45" y="105" width="170" height="110" class="box"/>
  <text x="130" y="140" text-anchor="middle" class="label">Arduino</text>
  <text x="130" y="168" text-anchor="middle" class="small">D2 y D3</text>
  <text x="130" y="192" text-anchor="middle" class="small">00, 01, 10, 11</text>

  <rect x="265" y="105" width="190" height="110" class="box"/>
  <text x="360" y="140" text-anchor="middle" class="label">Adaptacion</text>
  <text x="360" y="168" text-anchor="middle" class="small">divisores resistivos</text>
  <text x="360" y="192" text-anchor="middle" class="small">5 V a 3.21 V</text>

  <rect x="505" y="82" width="250" height="155" class="box kernel"/>
  <text x="630" y="118" text-anchor="middle" class="label">Raspberry Pi 5</text>
  <text x="630" y="147" text-anchor="middle" class="small">Kernel space</text>
  <text x="630" y="173" text-anchor="middle" class="small">dual_gpio_input_module.ko</text>
  <text x="630" y="199" text-anchor="middle" class="small">/dev/tp5_gpio</text>

  <rect x="805" y="105" width="240" height="110" class="box user"/>
  <text x="925" y="140" text-anchor="middle" class="label">Lector C</text>
  <text x="925" y="168" text-anchor="middle" class="small">gpio_jsonl_reader</text>
  <text x="925" y="192" text-anchor="middle" class="small">JSON Lines por stdout</text>

  <rect x="505" y="330" width="250" height="115" class="box web"/>
  <text x="630" y="365" text-anchor="middle" class="label">Notebook</text>
  <text x="630" y="393" text-anchor="middle" class="small">Docker + dashboard web</text>
  <text x="630" y="419" text-anchor="middle" class="small">POST /api/samples</text>

  <path d="M 215 160 L 265 160" class="arrow"/>
  <path d="M 455 160 L 505 160" class="arrow"/>
  <path d="M 755 160 L 805 160" class="arrow"/>
  <path d="M 925 215 C 925 285 770 325 755 365" class="arrow"/>

  <text x="240" y="145" text-anchor="middle" class="small">senales 5 V</text>
  <text x="480" y="145" text-anchor="middle" class="small">senales 3.3 V</text>
  <text x="780" y="145" text-anchor="middle" class="small">lectura</text>
  <text x="868" y="292" text-anchor="middle" class="small">SSH</text>
</svg>
